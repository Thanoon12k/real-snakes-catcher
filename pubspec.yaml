name: snake_catcher
description: Snake Catcher - motion-triggered camera recorder with Telegram alerts.
publish_to: 'none'
version: 2.0.0+2
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.2
  video_player: ^2.9.1
  http: ^1.2.2
  gal: ^2.3.0
  image: ^4.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
