# Publishes this app's APK to My99apps (@my99apps_bot). Copy to .github/workflows/my-apps.yml.
# Run it from the Actions tab, or push a version tag: git tag v1.2.3 && git push --tags
name: My Apps publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: Thanoon12k/My99apps/.github/workflows/publish-apk.yml@main
    with:
      # Public .env lines the app needs at build time, e.g. SUPABASE_URL=... (empty if none).
      app_env: ''
