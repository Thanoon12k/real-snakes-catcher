# Builds the Android APK and publishes it to My99apps (@my99apps_bot board). From Thanoon12k/My99apps/templates.
# New apps land in Developing; a new build of an app replaces its download.
# Runs on version tags (git tag v1.2.3 && git push --tags) or by hand from the Actions tab.
# No secrets: the bot checks GitHub's OIDC token to know which repo is publishing.
name: My Apps publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: my-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  # Written to .env before the build (public client settings only). Leave '' if the app has no .env.
  APP_ENV: ''

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: App config
        run: if [ -n "${APP_ENV//[[:space:]]/}" ]; then printf '%s' "$APP_ENV" > .env; fi
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Publish to My Apps
        env:
          HUB: https://axncazensmjdqpczvzwf.supabase.co/functions/v1/my-apps-bot
        run: |
          set -euo pipefail
          APK=$(ls build/app/outputs/flutter-apk/*arm64*.apk | head -1)
          VER=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          FILE="${GITHUB_REPOSITORY#*/}-v${VER:-0}-arm64.apk"
          TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=my-apps" | jq -r .value)
          call() { curl -sS --fail-with-body -X POST "$HUB" -H "authorization: Bearer $TOKEN" \
            -H "content-type: application/json" -d "$1"; }
          URL=$(call "{\"event\":\"gh_upload_url\",\"file_name\":\"$FILE\"}" | jq -r .url)
          curl -sS --fail-with-body -X PUT "$URL" -H "content-type: application/vnd.android.package-archive" \
            --data-binary @"$APK" > /dev/null
          call "{\"event\":\"gh_publish\",\"file_name\":\"$FILE\"}"
          echo "Published $FILE"
