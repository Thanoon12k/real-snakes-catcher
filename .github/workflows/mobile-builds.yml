name: Android APK and iOS build check
on:
  push:
    branches: [website-and-mobile-builds]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Android APK (test signing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore generated Android tooling
        run: flutter create --platforms=android --project-name snake_catcher --org com.thanoon .
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: snake-catcher-android-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  ios:
    name: iOS compile check (unsigned, not installable)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native iOS project
        run: flutter create --platforms=ios --project-name snake_catcher --org com.thanoon .
      - name: Configure iOS permissions
        run: python3 mobile-ci/configure_ios.py
      - run: flutter pub get
      - run: flutter test
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: snake-catcher-ios-unsigned-not-installable
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
